<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#020617"/>

<defs>
<style>
.node { fill:#0b1220; stroke:#38bdf8; stroke-width:2; rx:12; }
.node2 { fill:#111827; stroke:#a78bfa; stroke-width:2; rx:12; }
.text { fill:#e5f2ff; font-family:Arial, sans-serif; font-size:15px; font-weight:600; }
.small { fill:#a8c7df; font-family:Arial, sans-serif; font-size:12px; }
.line { stroke:#60a5fa; stroke-width:2; marker-end:url(#arrow); }
</style>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#60a5fa" />
</marker>
</defs>

