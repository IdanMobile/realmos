name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: realmos
          POSTGRES_PASSWORD: realmos
          POSTGRES_DB: realmos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realmos -d realmos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://realmos:realmos@localhost:5432/realmos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 9.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @realmos/web exec playwright install chromium --with-deps

      - name: Browser E2E smoke
        run: pnpm test:e2e

      - name: Postgres operational persistence smoke
        run: pnpm test:postgres
